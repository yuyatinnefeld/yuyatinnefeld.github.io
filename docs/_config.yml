# Set theme
remote_theme: daattali/beautiful-jekyll@5.0.0

title: yuya's notes

author: Yuya Tinnefeld

navbar-links:
  About: "/aboutme"
  Notes: "/blog/main"
  Tech Blog: "https://yuya-techfeld.github.io"

social-network-links:
  email: "yuyatinnefeld@gmail.com"
  instagram: y_u_story

url-pretty: "yuyatinnefeld.github.io"

site-css:
  - "/assets/css/custom-styles.css"

# Personalize colors
navbar-col: "#F5F2EC"
navbar-text-col: "#3A3835"
navbar-border-col: "transparent"
page-col: "#F5F2EC"
text-col: "#3A3835"
link-col: "#7A8570"
hover-col: "#9A6F5B"
footer-col: "#F5F2EC"
footer-text-col: "#8A8680"
footer-link-col: "#3A3835"
footer-hover-col: "#9A6F5B"

# Output options (more information on Jekyll's site)
timezone: "Germany/Berlin"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true  # add comments to all blog posts
      social-share: true # add social media sharing buttons to all blog posts
  -
    scope:
      path: "" # any file that's not a post will be a "page" layout by default
    values:
      layout: "page"

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap

